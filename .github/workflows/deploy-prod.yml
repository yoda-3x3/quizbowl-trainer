# Deploys prod on every push to main: D1 migrations -> Worker -> Pages.
# Needs the repo secret CLOUDFLARE_API_TOKEN (token for account below).
name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: a457e22d87f72f70b620c3819db6f7c0
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply qb-trainer-auth --remote

      - name: Deploy Worker (quizbowl-rooms)
        run: npx wrangler deploy

      - name: Deploy Pages (qb-trainer, main)
        run: >
          npx wrangler pages deploy dist
          --project-name qb-trainer
          --branch main
          --commit-hash ${{ github.sha }}
          --commit-dirty=true
