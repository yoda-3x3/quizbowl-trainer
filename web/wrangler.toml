name = "quizbowl-rooms"
main = "workers/room/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
account_id = "a457e22d87f72f70b620c3819db6f7c0"

# Workers AI: neural read-aloud for voice mode (POST /api/tts).
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# D1 database for username/password accounts. Local dev creates the database
# the first time `wrangler dev` runs with the --local flag; migrations under
# workers/room/migrations/ apply with `wrangler d1 migrations apply qb-trainer-auth --local`.
[[d1_databases]]
binding = "DB"
database_name = "qb-trainer-auth"
database_id = "a2f6f5e8-ed7d-4828-a9c9-5ec64425a0a4"
migrations_dir = "workers/room/migrations"

# Local dev:   npx wrangler dev
# Deploy:      npx wrangler deploy (prod)
#              npx wrangler deploy --env qa    (qa)
#              npx wrangler deploy --env prev  (prev)
#              npx wrangler deploy --env dev   (dev)
#
# The front end is a separate Cloudflare Pages project serving web/dist.
# Point it at this Worker with a /api/* route once both are deployed.
#
# Environment matrix
# ------------------
# | Branch  | Pages URL                           | Worker env | Worker URL                                     |
# |---------|-------------------------------------|------------|------------------------------------------------|
# | main    | qb-trainer.pages.dev                | (top)      | quizbowl-rooms.<account>.workers.dev           |
# | qa      | qa.qb-trainer.pages.dev             | qa         | qa-quizbowl-rooms.<account>.workers.dev        |
# | preview | preview.qb-trainer.pages.dev        | prev       | prev-quizbowl-rooms.<account>.workers.dev      |
# | dev     | dev.qb-trainer.pages.dev            | dev        | dev-quizbowl-rooms.<account>.workers.dev       |
#
# All envs share the single qb-trainer-auth D1 database for now. Separate
# databases per environment belong in a follow-up: copy the migrations dir,
# create new D1s with `wrangler d1 create qb-trainer-auth-<env>`, point each
# [env.*] block at its own database_id, and reset account/tournament data.
# Until then, qa/prev/dev writes land in the same table as prod.

# -- qa: release candidate; auto-deploy on push to the `qa` branch -------
[env.qa]
name = "qa-quizbowl-rooms"
[env.qa.ai]
binding = "AI"
[[env.qa.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
[[env.qa.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
[[env.qa.d1_databases]]
binding = "DB"
database_name = "qb-trainer-auth"
database_id = "a2f6f5e8-ed7d-4828-a9c9-5ec64425a0a4"
migrations_dir = "workers/room/migrations"

# -- prev: staging / integration ----------------------------------------
[env.prev]
name = "prev-quizbowl-rooms"
[env.prev.ai]
binding = "AI"
[[env.prev.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
[[env.prev.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
[[env.prev.d1_databases]]
binding = "DB"
database_name = "qb-trainer-auth"
database_id = "a2f6f5e8-ed7d-4828-a9c9-5ec64425a0a4"
migrations_dir = "workers/room/migrations"

# -- dev: open sandbox, anything goes -----------------------------------
[env.dev]
name = "dev-quizbowl-rooms"
[env.dev.ai]
binding = "AI"
[[env.dev.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
[[env.dev.d1_databases]]
binding = "DB"
database_name = "qb-trainer-auth"
database_id = "a2f6f5e8-ed7d-4828-a9c9-5ec64425a0a4"
migrations_dir = "workers/room/migrations"
