name = "quizbowl-rooms"
main = "workers/room/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
account_id = "261f5b8f139b7d464d0f0069938b89a9"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# D1 database for username/password accounts. Local dev creates the database
# the first time `wrangler dev` runs with the --local flag; migrations under
# workers/room/migrations/ apply with `wrangler d1 migrations apply qb-trainer-auth --local`.
[[d1_databases]]
binding = "DB"
database_name = "qb-trainer-auth"
database_id = "76991ab2-3577-470a-aa3e-32139d85f8fd"
migrations_dir = "workers/room/migrations"

# Local dev:   npx wrangler dev
# Deploy:      npx wrangler deploy
#
# The front end is a separate Cloudflare Pages project serving web/dist.
# Point it at this Worker with a /api/* route once both are deployed.
