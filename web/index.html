<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0a08" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ec" />
    <meta
      name="description"
      content="Quizbowl and Ohio Academic Competition practice: pyramidal tossups, bonuses, ear training and OAC matches."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Futura is a licensed commercial face, not available from Google Fonts.
      It renders natively wherever it's installed (common on macOS); Century
      Gothic is the closest Windows-native substitute. Questrial is the free
      geometric-sans loaded here as the actual fallback for everyone else, so
      the font stack in theme.css (Futura, Century Gothic, Questrial, ...)
      always lands on *something* geometric rather than a generic sans.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Questrial&family=Lora:wght@400;500;600&display=swap"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads none of the manifest's icons, so it needs its own link. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quizbowl" />
    <title>Quizbowl Trainer</title>
    <script>
      // Self-heal: if a same-origin script or stylesheet fails to load (stuck
      // service worker serving stale HTML that points at hashed assets this
      // deploy no longer has), unregister every SW, nuke every cache, and
      // hard-reload once. Session-storage guard stops reload loops: at most
      // one rescue per tab per session.
      (function () {
        var KEY = 'qb-sw-rescue-attempted';
        function rescue(reason) {
          if (sessionStorage.getItem(KEY)) return;
          sessionStorage.setItem(KEY, reason || '1');
          Promise.all([
            navigator.serviceWorker
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              : Promise.resolve(),
            window.caches
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              : Promise.resolve(),
          ]).finally(function () {
            location.replace(location.pathname + '?r=' + Date.now());
          });
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t || t === window) return;
          var url = t.src || t.href;
          if (typeof url !== 'string') return;
          if (url.indexOf(location.origin) !== 0) return;
          if (/\.(js|mjs|css)(\?|$)/.test(url)) rescue('asset:' + url);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e && e.reason && (e.reason.message || String(e.reason));
          if (msg && /Loading (chunk|CSS|module)|Failed to fetch dynamically imported/.test(msg)) {
            rescue('chunk:' + msg);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
